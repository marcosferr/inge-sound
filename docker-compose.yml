# Despliegue en CPU: API + frontend, sin dependencias externas.
#   docker compose up --build
# Para GPU y cola distribuida:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      INGE_DATA_DIR: /data
      INGE_QUEUE_BACKEND: ${INGE_QUEUE_BACKEND:-thread}
      INGE_WORKER_CONCURRENCY: ${INGE_WORKER_CONCURRENCY:-1}
      INGE_MAX_UPLOAD_MB: ${INGE_MAX_UPLOAD_MB:-200}
      INGE_MAX_FILES_PER_JOB: ${INGE_MAX_FILES_PER_JOB:-10}
      INGE_RETENTION_HOURS: ${INGE_RETENTION_HOURS:-48}
      INGE_JOB_TIMEOUT_SECONDS: ${INGE_JOB_TIMEOUT_SECONDS:-10800}
      TORCH_HOME: /models
    volumes:
      - data:/data
      # Los checkpoints de Demucs pesan cientos de MB: este volumen evita
      # volver a descargarlos en cada arranque.
      - models:/models
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${INGE_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
  models:
