server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Tiene que cubrir lo que acepta la API: INGE_MAX_FILES_PER_JOB *
    # INGE_MAX_UPLOAD_MB (por defecto 10 x 200 MB). Si subís esos límites,
    # subí este también o nginx cortará la subida con un 413 al final.
    client_max_body_size 4g;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La separación puede tardar horas y el progreso llega por SSE:
        # sin esto nginx cortaría el stream y bufferearía los eventos.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
        proxy_cache off;
        # No se desactiva chunked_transfer_encoding: las dos respuestas sin
        # Content-Length (el stream SSE y el ZIP al vuelo) quedarían delimitadas
        # solo por el cierre de la conexión, lo que impide reutilizarla y hace
        # que un ZIP truncado llegue indistinguible de uno completo.
    }
}
